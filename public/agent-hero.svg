<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9061F9" />
      <stop offset="100%" stop-color="#7E3AF2" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9061F9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7E3AF2" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F4FF" />
      <stop offset="100%" stop-color="#EDEBFE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Grid Pattern -->
  <g class="grid-pattern">
    <rect x="50" y="100" width="700" height="400" fill="none" stroke="#EDEBFE" stroke-width="2" rx="20" />
    
    <!-- Grid Lines -->
    <g stroke="#EDEBFE" stroke-width="1" stroke-dasharray="3,3">
      <line x1="50" y1="200" x2="750" y2="200" />
      <line x1="50" y1="300" x2="750" y2="300" />
      <line x1="50" y1="400" x2="750" y2="400" />
      
      <line x1="200" y1="100" x2="200" y2="500" />
      <line x1="350" y1="100" x2="350" y2="500" />
      <line x1="500" y1="100" x2="500" y2="500" />
      <line x1="650" y1="100" x2="650" y2="500" />
    </g>
  </g>

  <!-- Main Computer/Server -->
  <g class="computer">
    <rect x="300" y="180" width="200" height="160" rx="5" fill="url(#purpleGradient)" />
    <rect x="310" y="190" width="180" height="120" rx="3" fill="url(#screenGradient)" />
    
    <!-- Computer Base -->
    <rect x="335" y="340" width="130" height="10" rx="2" fill="#7E3AF2" />
    <rect x="370" y="350" width="60" height="20" rx="3" fill="#9061F9" />
    
    <!-- Screen Content -->
    <g class="screen-content">
      <!-- Status Bar -->
      <rect x="320" y="200" width="160" height="15" rx="2" fill="#7E3AF2" opacity="0.7" />
      <circle cx="330" cy="207" r="3" fill="#FF5555" />
      <circle cx="340" cy="207" r="3" fill="#FFBB33" />
      <circle cx="350" cy="207" r="3" fill="#55DD55" />
      
      <!-- Code Lines -->
      <rect x="325" y="225" width="100" height="4" rx="1" fill="#7E3AF2" opacity="0.5">
        <animate attributeName="width" values="100;120;100" dur="4s" repeatCount="indefinite" />
      </rect>
      <rect x="325" y="235" width="80" height="4" rx="1" fill="#7E3AF2" opacity="0.5">
        <animate attributeName="width" values="80;110;80" dur="3.5s" repeatCount="indefinite" />
      </rect>
      <rect x="325" y="245" width="130" height="4" rx="1" fill="#7E3AF2" opacity="0.5">
        <animate attributeName="width" values="130;95;130" dur="4.2s" repeatCount="indefinite" />
      </rect>
      <rect x="325" y="255" width="70" height="4" rx="1" fill="#7E3AF2" opacity="0.5">
        <animate attributeName="width" values="70;100;70" dur="3.8s" repeatCount="indefinite" />
      </rect>
      <rect x="325" y="265" width="110" height="4" rx="1" fill="#7E3AF2" opacity="0.5">
        <animate attributeName="width" values="110;85;110" dur="4.5s" repeatCount="indefinite" />
      </rect>
      <rect x="325" y="275" width="90" height="4" rx="1" fill="#7E3AF2" opacity="0.5">
        <animate attributeName="width" values="90;120;90" dur="3.7s" repeatCount="indefinite" />
      </rect>
      <rect x="325" y="285" width="120" height="4" rx="1" fill="#7E3AF2" opacity="0.5">
        <animate attributeName="width" values="120;95;120" dur="4.3s" repeatCount="indefinite" />
      </rect>
      
      <!-- Animated Cursor -->
      <rect x="325" y="295" width="5" height="10" fill="#7E3AF2" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Connection Lines -->
  <g class="connection-lines">
    <!-- To Mobile -->
    <path d="M500,240 Q570,210 620,235" stroke="#7E3AF2" stroke-width="2" fill="none" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="20" dur="2s" repeatCount="indefinite" />
    </path>
    <circle cx="620" cy="235" r="3" fill="#7E3AF2">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <!-- To Desktop -->
    <path d="M500,260 Q570,300 620,285" stroke="#7E3AF2" stroke-width="2" fill="none" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="20" dur="2.5s" repeatCount="indefinite" />
    </path>
    <circle cx="620" cy="285" r="3" fill="#7E3AF2">
      <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite" />
    </circle>
    
    <!-- To Cloud -->
    <path d="M300,240 Q230,210 180,235" stroke="#7E3AF2" stroke-width="2" fill="none" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="20" dur="3s" repeatCount="indefinite" />
    </path>
    <circle cx="180" cy="235" r="3" fill="#7E3AF2">
      <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite" />
    </circle>
    
    <!-- To Database -->
    <path d="M300,260 Q230,300 180,285" stroke="#7E3AF2" stroke-width="2" fill="none" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="20" dur="2.8s" repeatCount="indefinite" />
    </path>
    <circle cx="180" cy="285" r="3" fill="#7E3AF2">
      <animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Test Devices -->
  <!-- Mobile -->
  <g class="mobile-device">
    <rect x="620" y="210" width="50" height="80" rx="5" fill="#9061F9" />
    <rect x="625" y="215" width="40" height="60" rx="2" fill="#F3F4FF" />
    <circle cx="645" cy="285" r="3" fill="#F3F4FF" />
    
    <!-- Mobile Screen Content -->
    <rect x="630" y="225" width="30" height="5" rx="1" fill="#7E3AF2" opacity="0.5" />
    <rect x="630" y="235" width="20" height="5" rx="1" fill="#7E3AF2" opacity="0.5" />
    <rect x="630" y="245" width="25" height="5" rx="1" fill="#7E3AF2" opacity="0.5" />
    <rect x="630" y="255" width="15" height="5" rx="1" fill="#7E3AF2" opacity="0.5" />
  </g>
  
  <!-- Desktop -->
  <g class="desktop">
    <rect x="610" y="300" width="70" height="50" rx="2" fill="#9061F9" />
    <rect x="615" y="305" width="60" height="35" rx="1" fill="#F3F4FF" />
    <rect x="635" y="350" width="20" height="15" fill="#7E3AF2" />
    <rect x="625" y="365" width="40" height="5" rx="1" fill="#9061F9" />
    
    <!-- Desktop Screen Content -->
    <rect x="620" y="310" width="25" height="3" rx="1" fill="#7E3AF2" opacity="0.5" />
    <rect x="620" y="315" width="35" height="3" rx="1" fill="#7E3AF2" opacity="0.5" />
    <rect x="620" y="320" width="20" height="3" rx="1" fill="#7E3AF2" opacity="0.5" />
    <rect x="620" y="325" width="30" height="3" rx="1" fill="#7E3AF2" opacity="0.5" />
    <rect x="620" y="330" width="25" height="3" rx="1" fill="#7E3AF2" opacity="0.5" />
  </g>

  <!-- Cloud -->
  <g class="cloud">
    <circle cx="170" cy="220" r="15" fill="#9061F9" />
    <circle cx="190" cy="225" r="15" fill="#9061F9" />
    <circle cx="165" cy="235" r="12" fill="#9061F9" />
    <rect x="165" y="220" width="25" height="15" fill="#9061F9" />
    <text x="175" y="230" font-size="14" fill="#F3F4FF" text-anchor="middle">☁️</text>
  </g>
  
  <!-- Database -->
  <g class="database">
    <path d="M180,270 C150,270 150,280 180,280 C210,280 210,270 180,270 Z" fill="#9061F9" />
    <path d="M150,280 L150,295 C150,305 210,305 210,295 L210,280" fill="#7E3AF2" />
    <path d="M180,295 C150,295 150,305 180,305 C210,305 210,295 180,295 Z" fill="#9061F9" />
    
    <rect x="165" y="275" width="30" height="3" rx="1" fill="#F3F4FF" opacity="0.7" />
    <rect x="165" y="282" width="20" height="3" rx="1" fill="#F3F4FF" opacity="0.7" />
    <rect x="165" y="289" width="25" height="3" rx="1" fill="#F3F4FF" opacity="0.7" />
  </g>

  <!-- Animated Particles -->
  <g class="particles" filter="url(#glow)">
    <!-- Main pulse from computer -->
    <circle cx="400" cy="250" r="20" fill="url(#glowGradient)" opacity="0.2">
      <animate attributeName="r" values="20;80;20" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="5s" repeatCount="indefinite" />
    </circle>
    
    <!-- Small data particles -->
    <circle cx="400" cy="250" r="3" fill="#7E3AF2" opacity="0.8">
      <animate attributeName="cx" values="400;480;560;620" dur="4s" repeatCount="indefinite" />
      <animate attributeName="cy" values="250;230;240;235" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="400" cy="250" r="3" fill="#7E3AF2" opacity="0.8">
      <animate attributeName="cx" values="400;480;560;610" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="250;270;280;285" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;1;0.8" dur="4.5s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="400" cy="250" r="3" fill="#7E3AF2" opacity="0.8">
      <animate attributeName="cx" values="400;320;240;180" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="cy" values="250;230;240;235" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3.8s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="400" cy="250" r="3" fill="#7E3AF2" opacity="0.8">
      <animate attributeName="cx" values="400;320;240;180" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="cy" values="250;270;280;285" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;1;0.8" dur="4.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- TesterAlly Logo/Text -->
  <g class="logo" transform="translate(300, 430)">
    <rect x="0" y="0" width="200" height="40" rx="5" fill="#7E3AF2" />
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">TesterAlly Agent</text>
  </g>

  <!-- Animated Connection Pulses -->
  <g class="connection-pulses">
    <circle cx="400" cy="250" r="5" fill="none" stroke="#7E3AF2" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="5;100;5" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0;0.5" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="400" cy="250" r="5" fill="none" stroke="#7E3AF2" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="5;100;5" dur="6s" begin="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0;0.5" dur="6s" begin="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Status Indicators -->
  <g class="status-indicators">
    <circle cx="200" cy="470" r="5" fill="#55DD55">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="210" y="475" font-family="Arial, sans-serif" font-size="12" fill="#555555">Agent Online</text>
    
    <circle cx="200" cy="490" r="5" fill="#7E3AF2">
      <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="210" y="495" font-family="Arial, sans-serif" font-size="12" fill="#555555">Tests Active</text>
  </g>
</svg>
